<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Tile -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Outer Hexagon Frame -->
  <polygon points="50,12 85,30 85,70 50,88 15,70 15,30" fill="#0b1329" stroke="#06b6d4" stroke-width="4"/>
  
  <!-- Tech Circuit Dots -->
  <circle cx="50" cy="18" r="2.5" fill="#22d3ee"/>
  <circle cx="78" cy="33" r="2.5" fill="#22d3ee"/>
  <circle cx="78" cy="67" r="2.5" fill="#06b6d4"/>
  <circle cx="50" cy="82" r="2.5" fill="#22d3ee"/>
  <circle cx="22" cy="67" r="2.5" fill="#06b6d4"/>
  <circle cx="22" cy="33" r="2.5" fill="#22d3ee"/>

  <!-- Stylized Cybernetic 'G' Monogram & Lightning Node -->
  <path d="M 65 35 C 58 26, 38 26, 32 38 C 24 50, 24 62, 35 72 C 47 80, 63 76, 67 64 C 69 58, 65 52, 52 52 L 46 52" stroke="#00f0ff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Lightning Accent Spark -->
  <path d="M 52 40 L 40 54 L 50 54 L 44 68" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Power Dot -->
  <circle cx="65" cy="64" r="3.5" fill="#00f0ff"/>
</svg>
